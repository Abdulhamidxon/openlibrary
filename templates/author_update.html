{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Update</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333333;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cccccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        button[type="submit"] {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #357abd;
        }
    </style>
</head>
<body>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">First Name</label>
            <input
                    type="text"
                    id="name"
                    name="first_name"
                    value="{{ author.first_name }}"
                    required
            >
        </div>
        <div class="form-group">
            <label for="name">Last Name</label>
            <input
                    type="text"
                    id="name"
                    name="last_name"
                    value="{{ author.last_name }}"
                    required
            >
        </div>
        <div class="form-group">
            <label for="name">Nickname</label>
            <input
                    type="text"
                    id="name"
                    name="nickname"
                    value="{{ author.nickname }}"
            >
        </div>
        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
